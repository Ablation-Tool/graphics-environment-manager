[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphics-environment-manager"
version = "0.1.0"
description = "A reusable native project dashboard for you and your AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pyte>=0.8.1,<1",
    "tkinterdnd2==0.7.0",
    "pywinpty>=2,<3; sys_platform == 'win32'",
]

[project.optional-dependencies]
drop = ["tkinterdnd2==0.7.0"]
windows = ["pywinpty>=2,<3; sys_platform == 'win32'"]

[project.scripts]
gem = "gem.cli:main"

[tool.setuptools.packages.find]
include = ["gem*"]

[tool.setuptools.package-data]
gem = ["assets/*.png"]
